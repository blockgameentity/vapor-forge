[package]
name = "vapor-forge-host-windows"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# Also emits the `version.dll` proxy (proxy/ + scripts/build-proxy.sh) when
# building for x86_64-pc-windows-gnu with MinGW available. See build.rs.
build = "build.rs"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
vapor-forge-pe = { path = "../pe" }
# The Windows detour writer lives in the engine so the host and the engine cannot
# plan two different entry patches: `writer::WindowsDetour` owns the
# instruction-boundary plan, the trampoline, the `VirtualProtect` window, the
# instruction-cache flush, and the restore on drop.
vapor-forge-hook-engine = { path = "../hook-engine" }
# The host-agnostic features the Linux host already runs: cloud, per-game
# identity, depotcache pre-seed and the local achievement rebuild. The host
# wires settings into them behind traits, it does not reimplement them.
vapor-forge-config = { path = "../config" }
vapor-forge-core = { path = "../runtime-core" }
vapor-forge-features = { path = "../features" }
vapor-forge-scripting = { path = "../scripting" }
iced-x86.workspace = true
vapor-forge-patterns = { path = "../patterns", default-features = false, features = ["runtime-semantic"] }
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
