# Vapor Forge configuration.
# Fields without a leading "#" are recommended defaults and match runtime
# defaults. Vapor Forge keeps these fields present and sorted.
# Lines starting with "#" are examples. Uncomment them only when needed.

# Runtime logging, diagnostics, and pattern hotfix source.
[runtime]
log_level = "info"          # trace, debug, info, warn, error
diagnostics = false         # write extra hook/module diagnostics to logs
# Online pattern hotfixes, enabled by default against this project's own pattern
# sources, so a Steam update can be answered by pushing a file rather than
# shipping a build. {arch} picks the per-architecture file; ordinary and steamrt
# live inside it as variants, and an optional {family} can split them instead.
# A download is adopted only after it validates against the live module, so a
# stale or bad file cannot break hooks. Set to "" to stop fetching; that leaves
# an already-validated cache active.
patterns_url = "https://raw.githubusercontent.com/Hintay/vapor-forge/main/res/patterns/{arch}.toml"

# SteamUI toast notifications.
[toast]
enabled = true
init = true                 # show a startup toast after SteamUI bridge is ready

# Family sharing concurrent-play unlock.
[apps.shared]
enabled = true
# Family-share correctness, both on by default because both fix a wrong label:
# validate_lender re-checks a claimed lender before trusting a family label (an
# app we ingested must never read back as "from family library"), and
# clean_borrower_markers removes a borrower marker once an app is no longer
# borrowed. Set either to false to restore the pre-fix behaviour.
validate_lender = true
clean_borrower_markers = true
# include = [480, 730]      # only unlock these family-shared apps
# exclude = [730]           # unlock all family-shared apps except these

# Cloud sync control for apps controlled by Vapor Forge.
[cloud]
backend = "disabled"        # disabled, local, or cumulus

[cloud.local]
path = ""

# Optional Syncthing readiness and garbage-collection boundary.
[cloud.local.syncthing]
enabled = false
url = "http://127.0.0.1:8384"
api_key = ""
folder_id = ""             # Folder whose path exactly equals cloud.local.path
timeout_ms = 2000

[cloud.cumulus]
server_url = ""             # Cumulus origin, for example https://cloud.example.com
token = ""                  # Cumulus device bearer token
timeout_connect_ms = 5000
timeout_ms = 15000

# Ticket generation and ticket cache behavior.
[ticket]
cache = "disk"              # disk or session
auto_delegate = false       # enable delegate mode when the helper detects it

# Ticket sources asked in order: "local_cache", "credential_store", "registry".
# The first source that has the ticket wins; every attempt is logged and the
# winner is reported back to the caller. Leaving the list at its default keeps
# the single source this build has always used, so nothing changes until a
# second entry is added. Repeating a source, or emptying the list, is a load
# error rather than something discovered when a game asks for a ticket.
source_order = ["local_cache"]

# Denuvo authorisation: "off" (default) hands the app one ticket, exactly as
# before. "lease" gives the authorisation an acquisition time and an explicit
# expiry; the caller renews it before it lapses, and a lapsed lease is reported
# as expired so it can never be mistaken for a valid one. lease_secs is only
# read in lease mode.
denuvo_mode = "off"
denuvo_lease_secs = 300

# Structural Denuvo detection from PE section names, DLL names and flags. Off by
# default. denuvo_override is a manual verdict that wins over detection (true
# forces Denuvo, false forces not-Denuvo, absent lets detection decide); with
# detection off and no override, no app is treated as Denuvo-protected.
denuvo_detection = false
# denuvo_override = true

# Manifest request-code providers for controlled apps, in preference order.
# The host tool (cheesetool) writes this list. Vapor Forge ships no provider
# catalogue, no provider hostnames and no default list, and resolves no provider
# names: every entry is a table describing one endpoint, so a new source needs no
# new build. While the list is empty no request code is fetched at all; the
# reason is logged and the request degrades instead. Tables may span several
# lines:
#
#   providers = [
#       {
#           name = "example",                       # shown in logs; must be unique
#           url = "https://host.example/manifest/{depotId}/{gid}",
#           # {gid} is required; {depotId} (legacy {depot_id}) and {appId} are
#           # also substituted
#           user_agent = "MyClient/1.0",            # optional
#           min_interval_ms = 1000,                 # optional; overrides the default below
#       },
#       {
#           name = "jsonsrc",
#           url = "https://x.example/{gid}",
#           format = "json",                        # "plain" (default) or "json"
#           json_field = "content",                 # required when format = "json"
#       },
#   ]
#
# A bare provider name is a load error, naming the migration. An entry that
# fails the rules above is skipped; `vapor-forge-config-check` lists what would
# be skipped.
[manifest]
providers = []
# Try the next provider when one fails. The host tool that writes `providers`
# (cheesetool) owns this flag and normally sets it true, so a depot one host
# cannot serve falls through to the next enabled host; only hosts the user left
# enabled are ever contacted, every attempt is logged at info level with the
# provider name and outcome, and the provider that served each code is reported
# back. A standalone install with no host keeps the conservative value: false
# means only the first entry is contacted and a failure is final.
failover = false
timeout_connect_ms = 5000
timeout_ms = 15000
# Minimum gap between two requests to the same provider. These are small shared
# services that degrade for everyone when one client bursts, and Steam asks for
# one code per depot, so leave this at 1s unless a provider documents otherwise.
min_interval_ms = 1000

# Offline achievement schema support.
[achievements]
# Rebuild achievement replies from local definitions when the schema cache is
# missing or unreadable. Off by default: with it off the stats path behaves as
# it always has.
local_rebuild = false
offline_schema = false

# Native library injection into launched games.
[library_inject]
helper_path = ""            # 64-bit Proton helper .so path

# Lua script search paths. Steam's config/lua directory is also scanned.
[scripting]
paths = []

# Development API socket for local testing and manual toast/debug commands.
# [debug]
# control_api = false

# Apps the current account does not own but Vapor Forge should present as owned.
# [[apps.inject]]
# id = 480
# dlc = [12345, 67890]
# ticket = "forge"          # forge or delegate
# purchase_time = 0         # 0 = auto

# Map an app to another app id for networking/rich presence compatibility.
# [app_avatar]
# 480 = 730
# 0 = 730                   # wildcard for all unowned apps

# Apply avatar mappings only when launch options contain a flag.
# [[app_avatar.rules]]
# flag = "-onlinefix"
# avatar = 480
# apps = [480]
# exclude = [730]

# Report another SteamID64 to one game through ISteamUser::GetSteamID, for
# saves bound to an account. Auth tickets and networking keep the real account,
# so only use it for offline play. Executables wrapped by Steam DRM or Denuvo
# compare the ownership ticket with this SteamID and refuse to start.
# [steam_id]
# 480 = 76561202255233023     # placeholder, not a real account

# Inject a native library into matching launched games through LD_PRELOAD.
# [[library_inject.libs]]
# path = "/home/user/mylib.so"
# flag = "-onlinefix"
# apps = [480]
# exclude = [730]
